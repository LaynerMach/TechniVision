<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHNIVISION - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

    <h1>TECHNIVISION</h1>
    <h2>Inicio de Sesión</h2>

    <form id="loginForm">

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
            required>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Ingresar
        </button>

    </form>

    <p id="mensaje"></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
