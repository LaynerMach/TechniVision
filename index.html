<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHNIVISION - Acceso</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-section { display: none; }
        .form-section.active { display: block; }
        .toggle-link { margin-top: 15px; text-align: center; cursor: pointer; color: #007bff; }
    </style>
</head>
<body>

<div class="login-container">

    <h1>TECHNIVISION</h1>
    
    <!-- Formulario de Iniciar Sesión -->
    <div id="loginSection" class="form-section active">
        <h2>Inicio de Sesión</h2>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Correo o Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <p class="toggle-link" onclick="toggleForm('register')">¿No tienes cuenta? Regístrate aquí</p>
    </div>

    <!-- Formulario de Registro -->
    <div id="registerSection" class="form-section">
        <h2>Registro de Usuario</h2>
        <form id="registerForm">
            <input type="text" id="regNombre" placeholder="Nombre completo" required>
            <input type="email" id="regEmail" placeholder="Correo electrónico" required>
            <input type="password" id="regPassword" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <p class="toggle-link" onclick="toggleForm('login')">¿Ya tienes cuenta? Inicia sesión</p>
    </div>

    <p id="mensaje" style="margin-top: 15px; text-align: center;"></p>

</div>

<script>
    function toggleForm(tipo) {
        document.getElementById('loginSection').classList.toggle('active', tipo === 'login');
        document.getElementById('registerSection').classList.toggle('active', tipo === 'register');
        document.getElementById('mensaje').textContent = '';
    }
</script>
<script src="js/login.js"></script>

</body>
</html>
